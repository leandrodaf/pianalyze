coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  go:
    paths:
      - cmd/
      - internal/
  frontend:
    paths:
      - frontend/src/
