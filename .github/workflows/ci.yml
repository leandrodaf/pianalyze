name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux needs webkit2gtk-4.1 (Ubuntu 24.04) and the matching build tag
          - os: ubuntu-latest
            go-tags: webkit2_41
          - os: macos-latest
            go-tags: ""
          - os: windows-latest
            go-tags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Wails on Linux requires webkit2gtk-4.1-dev (Ubuntu 24.04 ships 4.1, not 4.0)
      # MIDI library requires libasound2-dev (ALSA)
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Verify module graph
        run: go mod verify

      - name: Build
        run: go build -tags "${{ matrix.go-tags }}" ./...

      - name: Vet
        run: go vet -tags "${{ matrix.go-tags }}" ./...

      - name: Test (race detector)
        run: go test -race -tags "${{ matrix.go-tags }}" -timeout 120s -count=1 ./...

      - name: Benchmark (smoke)
        run: go test -tags "${{ matrix.go-tags }}" -run='^$' -bench=. -benchtime=1x ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run --build-tags webkit2_41 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build
