name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux needs webkit2gtk-4.1 (Ubuntu 24.04) and the matching build tag
          - os: ubuntu-latest
            go-tags: webkit2_41
          - os: macos-latest
            go-tags: ""
          - os: windows-latest
            go-tags: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Wails on Linux requires webkit2gtk-4.1-dev (Ubuntu 24.04 ships 4.1, not 4.0)
      # MIDI library requires libasound2-dev (ALSA)
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Verify module graph
        run: go mod verify

      - name: Build
        run: go build -tags "${{ matrix.go-tags }}" ./...

      - name: Vet
        run: go vet -tags "${{ matrix.go-tags }}" ./...

      # Coverage flags are Linux-only: the coverage profile is only used for the
      # Codecov upload below, and pwsh on Windows mis-splits the extra -flag=value
      # args (go test ends up resolving the package pattern to ".out").
      - name: Test (race detector)
        if: matrix.os != 'ubuntu-latest'
        run: go test -race -tags "${{ matrix.go-tags }}" -timeout 120s -count=1 ./...

      - name: Test (race detector, with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -tags "${{ matrix.go-tags }}" -timeout 120s -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Benchmark (smoke)
        run: go test -tags "${{ matrix.go-tags }}" -run='^$' -bench=. -benchtime=1x ./...

      # Coverage is only representative on the Linux leg (the other OSes skip
      # MIDI/webkit-gated code paths), so upload once to avoid double-counting.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run --build-tags webkit2_41 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./frontend/coverage
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: npm run build
