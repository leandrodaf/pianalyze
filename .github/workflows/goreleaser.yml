name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # ── Per-platform native builds ─────────────────────────────────────────────
  # CGO cross-compilation is not supported; each OS compiles its own binary.
  build:
    name: Build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            go-tags: webkit2_41
          - name: darwin-arm64
            os: macos-latest
            go-tags: ""
          - name: windows-amd64
            os: windows-latest
            go-tags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build binary
        shell: bash
        run: |
          TAGS="${{ matrix.go-tags }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            go build ${TAGS:+-tags "$TAGS"} -trimpath -ldflags "-s -w" -o pianalyze.exe .
          else
            go build ${TAGS:+-tags "$TAGS"} -trimpath -ldflags "-s -w" -o pianalyze .
          fi

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="pianalyze_${VERSION}_${{ matrix.name }}.tar.gz"
          tar -czf "$ARCHIVE" pianalyze
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archive = "pianalyze_${version}_${{ matrix.name }}.zip"
          Compress-Archive -Path pianalyze.exe -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  # ── Collect all archives, generate checksums, publish GitHub Release ────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Pianalyze ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
