name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # ── Per-platform native builds ─────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            nfpm-arch: amd64
          - name: darwin-arm64
            os: macos-latest
          - name: darwin-amd64
            os: macos-15-intel
          - name: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Build frontend
        working-directory: frontend
        env:
          SENTRY_RELEASE: ${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm ci && npm run build

      # Explicit per-OS build — no variable expansion tricks for build tags.
      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: go build -tags webkit2_41,production -trimpath -ldflags "-s -w -X main.BuildMode=production -X main.Version=${GITHUB_REF_NAME#v} -X main.SentryDSN=$SENTRY_DSN" -o pianalyze .

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: go build -tags production -trimpath -ldflags "-s -w -X main.BuildMode=production -X main.Version=${GITHUB_REF_NAME#v} -X main.SentryDSN=$SENTRY_DSN" -o pianalyze .

      - name: Embed icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          goversioninfo -o resource_windows_amd64.syso versioninfo.json

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: go build -tags production -trimpath -ldflags "-s -w -X main.BuildMode=production -X main.Version=$($env:GITHUB_REF_NAME -replace '^v','') -X main.SentryDSN=$env:SENTRY_DSN" -o pianalyze.exe .

      # ── Archive ──────────────────────────────────────────────────────────────

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="pianalyze_${VERSION}_${{ matrix.name }}.tar.gz"
          tar -czf "$ARCHIVE" pianalyze
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archive = "pianalyze_${version}_${{ matrix.name }}.zip"
          Compress-Archive -Path pianalyze.exe -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── .deb package (Linux only) ─────────────────────────────────────────

      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          VERSION="${GITHUB_REF_NAME#v}" \
          NFPM_ARCH="${{ matrix.nfpm-arch }}" \
            nfpm package --packager deb --config nfpm.yaml \
              --target "pianalyze_${GITHUB_REF_NAME#v}_${{ matrix.nfpm-arch }}.deb"
          echo "DEB=pianalyze_${GITHUB_REF_NAME#v}_${{ matrix.nfpm-arch }}.deb" >> "$GITHUB_ENV"

      # ── Upload ───────────────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}

  # ── Collect all archives and publish GitHub Release ────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "Pianalyze ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

  # ── Update GitHub Pages download links ─────────────────────────────────────
  update-pages:
    name: Update GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate docs/release.json and update index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, re, subprocess, os

          tag = os.environ['TAG']
          result = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'assets,tagName,publishedAt,url'],
              capture_output=True, text=True, check=True,
          )
          data = json.loads(result.stdout)
          version = data['tagName'].lstrip('v')
          out = {
              'version': version,
              'tag': data['tagName'],
              'published_at': data['publishedAt'],
              'release_url': data['url'],
          }

          def mb(size):
              return f"{size / 1024 / 1024:.2f}"

          for a in data['assets']:
              name = a['name']
              entry = {
                  'name': name,
                  'url': a['url'],
                  'size_mb': mb(a['size']),
                  'sha256': a.get('digest', '').removeprefix('sha256:'),
              }
              if name.endswith('_windows-amd64.zip'):
                  out['windows'] = entry
              elif name.endswith('_darwin-arm64.tar.gz'):
                  out['darwin_arm64'] = entry
              elif name.endswith('_darwin-amd64.tar.gz'):
                  out['darwin_amd64'] = entry
              elif name.endswith('_linux-amd64.tar.gz'):
                  out['linux_tar'] = entry
              elif name.endswith('_amd64.deb'):
                  out['linux_deb'] = entry

          with open('docs/release.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')

          # Update href attributes and version badge in index.html
          with open('docs/index.html', 'r') as f:
              html = f.read()

          # Version badge
          html = re.sub(
              r'(<!-- DL-VERSION-BADGE -->.*?<strong>)[^<]*(</strong>.*?href=")[^"]*(")',
              lambda m: m.group(1) + 'v' + version + m.group(2) + out['release_url'] + m.group(3),
              html, flags=re.DOTALL
          )

          replacements = {
              'DL-WIN':       out.get('windows', {}).get('url', ''),
              'DL-MAC-ARM64': out.get('darwin_arm64', {}).get('url', ''),
              'DL-MAC-AMD64': out.get('darwin_amd64', {}).get('url', ''),
              'DL-LINUX-TAR': out.get('linux_tar', {}).get('url', ''),
              'DL-LINUX-DEB': out.get('linux_deb', {}).get('url', ''),
          }

          for marker, url in replacements.items():
              if not url:
                  continue
              html = re.sub(
                  r'(<!-- ' + marker + r' -->\s*<a href=")[^"]*(")',
                  r'\g<1>' + url + r'\2',
                  html
              )

          # Windows file size
          win_size = out.get('windows', {}).get('size_mb', '')
          if win_size:
              html = re.sub(
                  r'(<!-- DL-WIN -->.*?<div class="download-size">)[^<]*(</div>)',
                  r'\g<1>' + win_size + r' MB\2',
                  html, flags=re.DOTALL
              )

          with open('docs/index.html', 'w') as f:
              f.write(html)

          print('Updated docs/release.json and docs/index.html for', tag)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/release.json docs/index.html
          git diff --cached --quiet || git commit -m "chore: update download links for ${{ github.ref_name }}"
          git push
