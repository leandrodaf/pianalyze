name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, if you have them. Include the MIDI device model if relevant.
      placeholder: |
        1. Connect a Casio CTK-3400SK over USB-MIDI
        2. Load a recording and press Play
        3. ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Pianalyze version
      placeholder: v0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Pianalyze logs via Zap — paste the console/JSON output around the failure, if you have it.
      render: shell
    validations:
      required: false
