name: pianalyze
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
maintainer: Leandro Ferreira <leandro.daf4@gmail.com>
description: |
  Real-time MIDI capture and piano learning desktop application.
  Synthesia-style note waterfall, recording, playback, and practice mode.
homepage: https://github.com/leandrodaf/pianalyze
license: MIT

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libasound2t64 | libasound2

contents:
  - src: pianalyze
    dst: /usr/bin/pianalyze
    file_info:
      mode: 0755

  - src: packaging/pianalyze.desktop
    dst: /usr/share/applications/pianalyze.desktop
