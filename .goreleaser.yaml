version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pianalyze
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    overrides:
      # webkit2gtk-4.1 is only available on Linux; the build tag is required there
      - goos: linux
        tags:
          - webkit2_41

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: leandrodaf
    name: pianalyze

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^Merge "
      - "^chore(deps)"
  groups:
    - title: "🚀 Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "📖 Documentation"
      regexp: "^docs"
      order: 2
    - title: "🔧 Other"
      order: 999

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
