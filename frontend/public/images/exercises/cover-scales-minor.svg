<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <g transform="translate(20, 80)">
    <!-- White keys -->
    <rect x="0"   y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="30"  y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="60"  y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="90"  y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="120" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="150" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="180" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="210" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="240" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="270" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="300" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="330" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="360" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <rect x="390" y="0" width="28" height="140" rx="3" fill="#cce0ff" opacity="0.85"/>
    <!-- Black keys -->
    <rect x="20"  y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="50"  y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="110" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="140" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="170" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="230" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="260" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="320" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="350" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <rect x="380" y="0" width="18" height="88" rx="2" fill="#080c1a"/>
    <!-- Natural minor scale highlights: W H W W H W W (A minor: A B C D E F G A) -->
    <!-- A=5, B=6, C=0, D=1, E=2, F=3, G=4 of white keys → positions 150,180,0,30,60,90,120,150 -->
    <rect x="0"   y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.95"/>
    <rect x="30"  y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.85"/>
    <rect x="60"  y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.8"/>
    <rect x="90"  y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.75"/>
    <rect x="120" y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.7"/>
    <rect x="150" y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.65"/>
    <rect x="180" y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.6"/>
    <rect x="210" y="100" width="28" height="40" rx="2" fill="#7c5cfc" filter="url(#glow)" opacity="0.95"/>
  </g>
  <g opacity="0.12">
    <line x1="0" y1="255" x2="480" y2="255" stroke="#aaaaff" stroke-width="1.5"/>
    <line x1="0" y1="263" x2="480" y2="263" stroke="#aaaaff" stroke-width="1.5"/>
    <line x1="0" y1="271" x2="480" y2="271" stroke="#aaaaff" stroke-width="1.5"/>
    <line x1="0" y1="279" x2="480" y2="279" stroke="#aaaaff" stroke-width="1.5"/>
    <line x1="0" y1="287" x2="480" y2="287" stroke="#aaaaff" stroke-width="1.5"/>
  </g>
</svg>
