<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="100%" style="stop-color:#1a0f23"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- Musical staff -->
  <g opacity="0.35">
    <line x1="20" y1="95"  x2="460" y2="95"  stroke="white" stroke-width="2"/>
    <line x1="20" y1="115" x2="460" y2="115" stroke="white" stroke-width="2"/>
    <line x1="20" y1="135" x2="460" y2="135" stroke="white" stroke-width="2"/>
    <line x1="20" y1="155" x2="460" y2="155" stroke="white" stroke-width="2"/>
    <line x1="20" y1="175" x2="460" y2="175" stroke="white" stroke-width="2"/>
  </g>
  <!-- Treble clef (simplified) -->
  <text x="30" y="178" fill="white" opacity="0.6" font-size="110" font-family="serif">𝄞</text>
  <!-- Music notes on staff -->
  <!-- Note 1 on line (E4) -->
  <ellipse cx="145" cy="155" rx="12" ry="9" fill="white" opacity="0.85" filter="url(#glow)"/>
  <line x1="157" y1="155" x2="157" y2="100" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <!-- Note 2 on space (F4) -->
  <ellipse cx="210" cy="145" rx="12" ry="9" fill="white" opacity="0.85" filter="url(#glow)"/>
  <line x1="222" y1="145" x2="222" y2="90" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <!-- Note 3 on line (G4) -->
  <ellipse cx="275" cy="135" rx="12" ry="9" fill="white" opacity="0.85" filter="url(#glow)"/>
  <line x1="287" y1="135" x2="287" y2="80" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <!-- Note 4 on space (A4) -->
  <ellipse cx="340" cy="125" rx="12" ry="9" fill="white" opacity="0.85" filter="url(#glow)"/>
  <line x1="352" y1="125" x2="352" y2="70" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <!-- Note 5 on line (B4) -->
  <ellipse cx="405" cy="115" rx="12" ry="9" fill="white" opacity="0.85" filter="url(#glow)"/>
  <line x1="417" y1="115" x2="417" y2="60" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <!-- Beam connecting some notes -->
  <line x1="157" y1="100" x2="222" y2="90" stroke="white" stroke-width="5" opacity="0.5"/>
  <line x1="287" y1="80" x2="352" y2="70" stroke="white" stroke-width="5" opacity="0.5"/>
  <!-- Small piano keys at bottom -->
  <g transform="translate(110, 220)" opacity="0.4">
    <rect x="0"   y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="20"  y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="40"  y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="60"  y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="80"  y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="100" y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="120" y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="140" y="0" width="18" height="55" rx="2" fill="white"/>
    <rect x="12"  y="0" width="12" height="34" rx="1" fill="#111"/>
    <rect x="32"  y="0" width="12" height="34" rx="1" fill="#111"/>
    <rect x="72"  y="0" width="12" height="34" rx="1" fill="#111"/>
    <rect x="92"  y="0" width="12" height="34" rx="1" fill="#111"/>
    <rect x="112" y="0" width="12" height="34" rx="1" fill="#111"/>
    <rect x="152" y="0" width="12" height="34" rx="1" fill="#111"/>
  </g>
</svg>
